name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vulkan: ['ON']
        include:
          - os: ubuntu-latest
            vulkan: 'OFF'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Vulkan headers (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
    - name: Configure
      run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=${{ matrix.vulkan }}
    - name: Build
      run: cmake --build build --config Release -j 4
